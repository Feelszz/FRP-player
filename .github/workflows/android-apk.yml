name: Build FPR Player APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar APK oficial
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Separar APK oficial
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fpr-player-official.apk
      - name: Preparar variante DEV
        run: sed -i "s|/#ativacao'|/#ativacao-dev'|" app/src/main/assets/index.html
      - name: Compilar APK DEV
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Separar APK DEV
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fpr-player-dev.apk
      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: fpr-player-apks
          path: |
            android-app/app/build/outputs/apk/debug/fpr-player-official.apk
            android-app/app/build/outputs/apk/debug/fpr-player-dev.apk
          if-no-files-found: error
