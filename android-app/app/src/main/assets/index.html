<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPR Player</title><style>
:root{font-family:Arial,sans-serif;color:#fff8f4;background:#151116}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#3b2019,transparent 40%),#151116}main{max-width:900px;margin:auto;padding:28px 18px 40px}.brand{display:flex;align-items:center;gap:10px;border-bottom:1px solid #3a3038;padding-bottom:18px}.mark{width:30px;height:30px;border:1px solid #e96a3a;border-radius:50%;display:grid;place-items:center;color:#e96a3a}.brand b{font-size:18px}.brand small{display:block;color:#ff9b71;font-size:8px;letter-spacing:3px}h1{font-size:clamp(38px,9vw,74px);line-height:.94;letter-spacing:-4px;margin:70px 0 16px}h1 em{color:#e96a3a;font-style:normal}.sub{color:#a99da4;line-height:1.6;font-size:14px}.card{margin-top:30px;padding:20px;border:1px solid #4b3845;border-radius:12px;background:#211a21}.label{color:#ff9b71;font-size:10px;font-weight:bold;letter-spacing:2px}.row{display:flex;gap:8px;margin-top:15px}.row input{min-width:0;flex:1;padding:14px;border:1px solid #5a4651;border-radius:6px;background:#151116;color:white}.btn{border:0;border-radius:6px;background:#e96a3a;color:#1e1414;padding:0 16px;font-weight:bold}.file{display:block;margin-top:12px;text-align:center;border:1px dashed #66515b;border-radius:6px;padding:15px;color:#d0c3ca}.file input{display:none}.status{color:#77d9a0;font-size:12px;min-height:18px;margin-top:12px}.layout{display:grid;grid-template-columns:1.35fr .8fr;gap:18px;margin-top:28px}.video{background:#0c0a0c;border-radius:9px;min-height:230px;display:grid;place-items:center;border:1px solid #322932}.video video{width:100%;max-height:420px}.empty{text-align:center;color:#a99da4;padding:30px}.list{max-height:420px;overflow:auto}.item{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:7px;background:transparent;color:white;padding:12px;margin-bottom:5px}.item:hover,.item.active{background:#32232a;border-color:#e96a3a}.item small{display:block;color:#a99da4;margin-top:5px}@media(max-width:700px){.layout{grid-template-columns:1fr}.row{flex-direction:column}.btn{height:45px}}
</style></head><body><main><header class="brand"><span class="mark">▶</span><div><b>FPR</b><small>PLAYER</small></div></header><h1>Seu conteúdo.<br><em>Seu ritmo.</em></h1><p class="sub">Adicione sua playlist dentro do aplicativo e assista em qualquer tela Android ou TV Box.</p><section class="card"><div class="label">IMPORTAR PLAYLIST M3U</div><div class="row"><input id="url" type="url" placeholder="https://seu-servidor.com/playlist.m3u"><button class="btn" id="load">Importar link</button></div><label class="file">Ou selecione um arquivo M3U<input id="file" type="file" accept=".m3u,.m3u8,.txt"></label><div id="status" class="status"></div></section><section class="layout"><div class="video"><div id="empty" class="empty">Selecione um item da playlist para reproduzir.</div><video id="player" controls playsinline hidden></video></div><div><div class="label">SUA PLAYLIST <span id="count">0</span></div><div id="list" class="list"></div></div></section></main><script>
let items=[],current=-1;const $=id=>document.getElementById(id);function parse(text){let a=[],meta=null;for(const raw of text.split(/\r?\n/)){const l=raw.trim();if(!l)continue;if(l.startsWith('#EXTINF')){const i=l.indexOf(',');meta={name:i>0?l.slice(i+1).trim():'Vídeo',group:(l.match(/group-title="([^"]*)"/)||[])[1]||'Sem grupo'};continue}if(l.startsWith('#'))continue;if(meta)a.push({name:meta.name,group:meta.group,url:l}),meta=null}return a}function render(){ $('count').textContent=items.length;$('list').innerHTML=items.map((x,i)=>`<button class="item ${i===current?'active':''}" data-i="${i}">${x.name}<small>${x.group}</small></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>play(+b.dataset.i))}function play(i){current=i;const x=items[i];$('player').src=x.url;$('player').hidden=false;$('empty').hidden=true;$('player').play().catch(()=>{});render()}function load(text,label){items=parse(text);if(!items.length)throw Error('Nenhum vídeo válido encontrado.');current=-1;render();$('status').textContent=`${items.length} itens carregados de ${label}.`}async function remote(){try{const u=$('url').value.trim();if(!/^https?:\/\//i.test(u))throw Error('Use um link HTTP ou HTTPS válido.');$('status').textContent='Carregando…';const r=await fetch(u);if(!r.ok)throw Error('Não foi possível acessar a playlist.');load(await r.text(),'link remoto')}catch(e){$('status').textContent=e.message}}$('load').onclick=remote;$('file').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>{try{load(r.result,f.name)}catch(x){$('status').textContent=x.message}};r.readAsText(f)}};
</script></body></html>
